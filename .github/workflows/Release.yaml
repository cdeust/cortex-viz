name: Release

# Filename casing is part of PyPI's Trusted Publisher identity. Keep this file
# as `Release.yaml` to match the verified publisher record exactly.

# Issue #37. Until now Hypermnesia MCP Viz had NO release workflow: 2.7.1 was cut by
# hand, so there was no committed, reproducible build path and therefore no
# artifact to attest. This workflow is the build that was missing — it is now
# the ONLY way a release is produced, and provenance layers on top of it.
#
# Delivery reality (do not confuse with "released"): hypermnesia-mcp-viz is consumed
# through Anthropic's plugin marketplace, PINNED in Cortex's marketplace
# manifest. Tagging + this GitHub Release do not reach installs by themselves;
# the release checklist still ENDS with bumping that pin. This is the same
# pin-gate lesson that let six zetetic-team-subagents releases and two
# hypermnesia-mcp-viz releases ship to zero installs (Cortex #179) — a release workflow
# that runs is necessary but not sufficient.
#
# The canonical distribution is published to PyPI as `hypermnesia-mcp-viz`
# through Trusted Publishing. No long-lived PyPI token exists: the protected
# `pypi` environment and id-token permission bind publication to this workflow,
# repository, tag, and environment. The canonical console command is
# `hypermnesia-mcp-viz`; no deprecated publication alias is emitted.
#
# docs/RELEASING.md step 5. The `publish-registry` job below publishes
# `server.json` to the official MCP Registry (registry.modelcontextprotocol.io)
# after `release` succeeds, so it can never point the registry at a PyPI
# version that does not exist. It has no committed tooling before this
# change — the registry drifted to 2.8.0 while PyPI and the GitHub Release
# were already at 3.1.0, the same "checklist step nobody ran" shape as the
# marketplace-pin lesson above. Auth is `mcp-publisher login github-oidc`, no
# secret: the same no-long-lived-credential pattern as the PyPI publish job.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Recovery path only. Existing release tag to (re)publish to the MCP
          Registry, e.g. v3.1.0. The matching version must already be on
          PyPI — this path does not rebuild or re-publish the package, it
          only repairs a registry entry that fell behind. Required for
          workflow_dispatch; the workflow refuses to guess.
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # --all-extras, not [dev]: leidenalg lives in the graph extra, and
      # installing only [dev] silently skipped tests/test_community_detection.py
      # and left 10 further tests uncollected — 660 run instead of 671.
      - name: Install package with test dependencies
        run: uv sync --locked --all-extras --python 3.12

      - name: Run test suite
        run: uv run --no-sync pytest -q

  release:
    name: Build, fingerprint UI, SBOM, attest + GitHub Release
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hypermnesia-mcp-viz
    permissions:
      contents: write       # create the release + upload assets
      id-token: write       # OIDC token Sigstore exchanges for a signing cert
      attestations: write   # record the build-provenance statement on the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # uv is the repo's own resolver (uv.lock is the source of truth) and it
      # builds through the same PEP 517 backend `python -m build` used, so the
      # sdist/wheel are byte-for-byte the same artifacts. It also removes the
      # unpinned `pip install build` step: Scorecard's pip predicate treats a
      # bare `pip install <pkg>` as unpinned regardless of any version pin,
      # and `uv` is not scanned at all (ossf/scorecard shell_download_validate).
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build sdist and wheel
        run: uv build

      - name: Verify canonical distribution identity and entry point
        run: python -m scripts.check_distribution_artifact

      # Fingerprint the browser-executed UI (issue #37 criterion 2). The 91 JS
      # files + HTML/CSS under ui/ are first-party STATIC assets — there is no
      # bundler to run, so "built and fingerprinted" means: pin every byte a
      # user's browser will execute to this exact commit. The manifest is a
      # sorted `sha256sum` over the whole tree; a tampered UI asset changes its
      # line, and the manifest is itself attested below. LC_ALL=C fixes sort
      # order so the manifest is reproducible across runners.
      - name: Fingerprint UI assets
        run: |
          set -euxo pipefail
          find ui -type f -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > hypermnesia-mcp-viz-ui-manifest.sha256
          echo "UI files fingerprinted: $(wc -l < hypermnesia-mcp-viz-ui-manifest.sha256)"
          head -5 hypermnesia-mcp-viz-ui-manifest.sha256

      # CycloneDX SBOM from uv.lock (issue #37 criterion 5). This covers the
      # Python dependency graph, including the viz-tile stack (datashader,
      # pyarrow, numba/llvmlite) that is the heaviest third-party surface. The
      # "vendored JS" the criterion mentions is first-party source, not
      # third-party packages, so it is inventoried by the UI manifest above
      # rather than duplicated here — the two together enumerate everything
      # that ships.
      - name: Build the SBOM
        run: |
          set -euxo pipefail
          uv export --frozen --all-extras --no-dev --no-emit-project --no-hashes \
            --format requirements-txt > sbom-requirements.txt
          wc -l sbom-requirements.txt
          uv tool run --from cyclonedx-bom cyclonedx-py requirements \
            sbom-requirements.txt --output-format JSON --output-file hypermnesia-mcp-viz.cdx.json
          ls -la hypermnesia-mcp-viz.cdx.json

      # Publish while dist/ contains distributions only. The checksum step
      # below adds *.sha256 sidecars that Twine rejects as unknown formats.
      - name: Publish canonical distribution to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

      - name: Compute SHA-256 checksums for every release asset
        run: |
          set -euxo pipefail
          for f in dist/* hypermnesia-mcp-viz.cdx.json hypermnesia-mcp-viz-ui-manifest.sha256; do
            sha256sum "$f" | tee "$f.sha256"
          done

      # Provenance before the GitHub Release upload binds each artifact digest
      # to this workflow, commit and runner. PyPI publication happens above so
      # dist/ is still free of checksum sidecars. Verify provenance with
      #   gh attestation verify <file> --repo cdeust/cortex-viz
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            hypermnesia-mcp-viz.cdx.json
            hypermnesia-mcp-viz-ui-manifest.sha256

      - name: Create GitHub Release with attested assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
            hypermnesia-mcp-viz.cdx.json
            hypermnesia-mcp-viz.cdx.json.sha256
            hypermnesia-mcp-viz-ui-manifest.sha256
            hypermnesia-mcp-viz-ui-manifest.sha256.sha256
          fail_on_unmatched_files: true

  publish-registry:
    # RELEASING.md step 5. Runs after PyPI publish + GitHub Release succeed
    # (needs: [test, release]) so it can never publish a registry entry
    # pointing at a package version that does not exist yet. Also runs on
    # workflow_dispatch as a recovery path, for the case where a version was
    # published to PyPI and tagged (test + release already succeeded on that
    # tag's push) but this job did not exist yet or failed — exactly the gap
    # that let the registry serve 2.8.0 while PyPI and the GitHub Release
    # were already at 3.1.0.
    name: Publish server.json to the MCP Registry
    needs: [test, release]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token the MCP Registry exchanges for a publish credential
    steps:
      # Fail loudly rather than silently skip: workflow_dispatch without an
      # explicit tag would otherwise publish whatever ref happened to be
      # selected in the UI, which is exactly the kind of unattended drift
      # this job exists to close.
      - name: Resolve target tag
        id: resolve
        run: |
          set -euxo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              echo "::error::workflow_dispatch requires a 'tag' input (e.g. v3.1.0) — refusing to guess which release to publish."
              exit 1
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Version+checksum pin lives in the action's defaults, not here —
      # .github/actions/install-mcp-publisher/action.yml. Before this action
      # existed, this pin and ci.yml's lived in two places and had already
      # drifted apart (v1.7.9 vs v1.8.1). A bump is one edit to that file.
      - name: Install mcp-publisher (checksum-verified)
        uses: ./.github/actions/install-mcp-publisher

      # The exact defect this job exists to prevent runs in both directions:
      # a registry entry must never point at a PyPI version that does not
      # exist. Check before authenticating, not after.
      - name: Verify the PyPI package version exists before publishing
        run: |
          set -euxo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          echo "Checking PyPI for hypermnesia-mcp-viz==${VERSION}"
          curl -fsSL "https://pypi.org/pypi/hypermnesia-mcp-viz/${VERSION}/json" > /dev/null

      # No secret: the `pypi` OIDC trusted-publishing pattern this repo
      # already uses for PyPI (see the workflow header) has a registry
      # equivalent — `mcp-publisher login github-oidc` exchanges this job's
      # GitHub Actions OIDC token for a registry credential scoped to
      # io.github.cdeust/*, using only the id-token: write permission above.
      # Source: modelcontextprotocol/registry docs/reference/cli/commands.md
      # ("GitHub OIDC (CI/CD)") and docs/modelcontextprotocol-io/github-actions.mdx
      # ("OIDC authentication (recommended)"), verified 2026-08-10.
      - name: Authenticate to the MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      # A "cannot publish duplicate version" 400 means the registry already
      # has this exact version — the desired end state for the
      # workflow_dispatch recovery path (RELEASING.md step 5: re-run this
      # job for a tag whose publish was missed or failed). On the normal
      # push-tag path the same error means something is wrong: this job
      # only runs once per tag (needs: [test, release]), so an existing
      # entry there is unexpected and must still fail loudly. The verify
      # step below still runs after a swallowed duplicate and independently
      # confirms the registry serves this version before the job can pass —
      # this branch narrows *which* mcp-publisher exit codes are treated as
      # non-fatal, it never widens what "passing" means.
      - name: Publish server.json to the MCP Registry
        run: |
          set +e
          OUTPUT=$(./mcp-publisher publish 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && echo "$OUTPUT" | grep -qi "duplicate version"; then
              echo "::notice::mcp-publisher reports ${{ steps.resolve.outputs.tag }} already published (workflow_dispatch recovery path) — treating as a candidate success, pending independent registry verification below."
            else
              echo "::error::mcp-publisher publish failed (exit ${STATUS})"
              exit "$STATUS"
            fi
          fi

      # A green `mcp-publisher publish` (or a swallowed duplicate-version
      # error above) is not proof (Move 2: verify externally, not by exit
      # code alone). Query the registry's own API and fail the job if it
      # disagrees with server.json.
      #
      # Bounded retry, not zero-tolerance: the registry API sits behind a
      # CDN cache in front of all public read endpoints (modelcontextprotocol/
      # registry docs/design/tech-architecture.md, "CDN Layer"), so a read
      # immediately after publish can observe a stale, pre-publish entry.
      # Measured on the v3.1.1 release (2026-08-09): publish completed at
      # 16:48:46 UTC and a read one second later, 16:48:47, still returned
      # the prior version — an empirical floor of >1s of staleness. No SLA
      # for the cache TTL is published, so the bound below is a stated
      # engineering assumption, not a measured constant: 12 attempts x 5s
      # = 60s, an order of magnitude above the observed 1s staleness, meant
      # to absorb ordinary CDN propagation without masking a genuine
      # publish failure. It still fails — this is a timeout, not an
      # unbounded retry-until-pass — when the registry never converges,
      # which is exactly the case this check exists to catch.
      - name: Verify the registry now serves the published version
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=5
          ACTUAL=""
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            ACTUAL=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=hypermnesia-mcp-viz" \
              | python3 -c "import json, sys; d = json.load(sys.stdin); latest = next(s for s in d['servers'] if s['_meta']['io.modelcontextprotocol.registry/official']['isLatest']); print(latest['server']['version'])")
            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: registry reports latest version ${ACTUAL} (expected ${VERSION})"
            if [ "$ACTUAL" = "$VERSION" ]; then
              echo "Registry converged to ${VERSION} on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          echo "::error::MCP Registry still serves ${ACTUAL}, expected ${VERSION} after ${MAX_ATTEMPTS} attempts (~$((MAX_ATTEMPTS * SLEEP_SECONDS))s). This is a non-convergence failure, not a propagation delay."
          exit 1

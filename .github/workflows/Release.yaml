# source: cdeust/cortex-viz@2169b84d70a5266a24ab3cdf1c915c0cba475efc .github/workflows/Release.yaml
# Existing artifact build, signing and publication commands retained.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag-ref dispatch builds and publishes that tag. Dispatch from a
          branch with this input only repairs its existing registry entry.
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install package with test dependencies
        run: uv sync --locked --all-extras --python 3.12

      - name: Run test suite
        run: uv run --no-sync pytest -q

  release:
    name: Build, fingerprint UI, SBOM, attest + GitHub Release
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hypermnesia-mcp-viz
    permissions:
      contents: write       # create the release + upload assets
      id-token: write       # OIDC token Sigstore exchanges for a signing cert
      attestations: write   # record the build-provenance statement on the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build sdist and wheel
        run: uv build

      - name: Verify canonical distribution identity and entry point
        run: python -m scripts.check_distribution_artifact

      - name: Fingerprint UI assets
        run: |
          set -euxo pipefail
          find ui -type f -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > hypermnesia-mcp-viz-ui-manifest.sha256
          echo "UI files fingerprinted: $(wc -l < hypermnesia-mcp-viz-ui-manifest.sha256)"
          head -5 hypermnesia-mcp-viz-ui-manifest.sha256

      - name: Build the SBOM
        run: |
          set -euxo pipefail
          uv export --frozen --all-extras --no-dev --no-emit-project --no-hashes \
            --format requirements-txt > sbom-requirements.txt
          wc -l sbom-requirements.txt
          uv tool run --from cyclonedx-bom cyclonedx-py requirements \
            sbom-requirements.txt --output-format JSON --output-file hypermnesia-mcp-viz.cdx.json
          ls -la hypermnesia-mcp-viz.cdx.json

      - name: Publish canonical distribution to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

      - name: Compute SHA-256 checksums for every release asset
        run: |
          set -euxo pipefail
          for f in dist/* hypermnesia-mcp-viz.cdx.json hypermnesia-mcp-viz-ui-manifest.sha256; do
            sha256sum "$f" | tee "$f.sha256"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            hypermnesia-mcp-viz.cdx.json
            hypermnesia-mcp-viz-ui-manifest.sha256

      - name: Create GitHub Release with attested assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
            hypermnesia-mcp-viz.cdx.json
            hypermnesia-mcp-viz.cdx.json.sha256
            hypermnesia-mcp-viz-ui-manifest.sha256
            hypermnesia-mcp-viz-ui-manifest.sha256.sha256
          fail_on_unmatched_files: true

  publish-registry:
    name: Publish server.json to the MCP Registry
    needs: [test, release]
    if: |
      always() &&
      (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token the MCP Registry exchanges for a publish credential
    steps:
      - name: Resolve target tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TARGET_REF_TYPE" != "tag" ]; then
            TAG="$INPUT_TAG"
            if [ -z "$TAG" ]; then
              echo "::error::workflow_dispatch requires a 'tag' input (e.g. v3.1.0) — refusing to guess which release to publish."
              exit 1
            fi
          else
            TAG="$TAG_REF"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install mcp-publisher (checksum-verified)
        uses: ./.github/actions/install-mcp-publisher

      - name: Verify the PyPI package version exists before publishing
        run: |
          set -euxo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          echo "Checking PyPI for hypermnesia-mcp-viz==${VERSION}"
          curl -fsSL "https://pypi.org/pypi/hypermnesia-mcp-viz/${VERSION}/json" > /dev/null

      - name: Authenticate to the MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP Registry
        run: |
          set +e
          OUTPUT=$(./mcp-publisher publish 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && echo "$OUTPUT" | grep -qi "duplicate version"; then
              echo "::notice::mcp-publisher reports ${{ steps.resolve.outputs.tag }} already published (workflow_dispatch recovery path) — treating as a candidate success, pending independent registry verification below."
            else
              echo "::error::mcp-publisher publish failed (exit ${STATUS})"
              exit "$STATUS"
            fi
          fi

      - name: Verify the registry now serves the published version
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=5
          ACTUAL=""
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            ACTUAL=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=hypermnesia-mcp-viz" \
              | python3 -c "import json, sys; d = json.load(sys.stdin); latest = next(s for s in d['servers'] if s['_meta']['io.modelcontextprotocol.registry/official']['isLatest']); print(latest['server']['version'])")
            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: registry reports latest version ${ACTUAL} (expected ${VERSION})"
            if [ "$ACTUAL" = "$VERSION" ]; then
              echo "Registry converged to ${VERSION} on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          echo "::error::MCP Registry still serves ${ACTUAL}, expected ${VERSION} after ${MAX_ATTEMPTS} attempts (~$((MAX_ATTEMPTS * SLEEP_SECONDS))s). This is a non-convergence failure, not a propagation delay."
          exit 1

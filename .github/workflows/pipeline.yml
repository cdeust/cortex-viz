# generated by zetetic-team-subagents render-ci (bootstrap, template pending on feat/single-ci-template)
# The one pipeline every repository of the owner runs, identical in shape everywhere:
# cdeust/zetetic-team-subagents, docs/superpowers/specs/2026-10-22-single-ci-design.md.
# The repository's five test commands live in ci.json at its root; nothing else is per
# repository. Jobs: contract, unit, regression, e2e, environment, install, review, merge, tag.
name: Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CLAUDE_CODE_VERSION: 2.1.296

jobs:
  # ci.json: exactly unit, regression, e2e, environment, install (non-empty
  # strings) plus an optional version_file that must exist. Every version
  # surface the repository carries must agree with it (design, decision 9).
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate ci.json
        run: |
          python3 - <<'PY'
          import json, os, sys, tomllib

          STEPS = ("unit", "regression", "e2e", "environment", "install")

          def read_version(path):
              with open(path, encoding="utf-8") as fh:
                  text = fh.read()
              if path.endswith(".json"):
                  data = json.loads(text)
                  return data.get("version") or (data.get("metadata") or {}).get("version")
              if path.endswith(".toml"):
                  data = tomllib.loads(text)
                  return (data.get("project") or {}).get("version") or (data.get("package") or {}).get("version")
              return None

          faults = []
          try:
              with open("ci.json", encoding="utf-8") as fh:
                  contract = json.load(fh)
          except (OSError, ValueError) as exc:
              sys.exit(f"ci.json: {exc}")
          if not isinstance(contract, dict):
              sys.exit("ci.json: not a JSON object")
          for key in STEPS:
              value = contract.get(key)
              if not isinstance(value, str) or not value.strip():
                  faults.append(f"ci.json: '{key}' must be a non-empty string command")
          for key in contract:
              if key not in STEPS and key != "version_file":
                  faults.append(f"ci.json: unknown key '{key}'")
          version_file = contract.get("version_file", ".claude-plugin/plugin.json")
          if not isinstance(version_file, str) or not os.path.isfile(version_file):
              faults.append(f"ci.json: version_file '{version_file}' does not exist")
              version = None
          else:
              version = read_version(version_file)
              if not isinstance(version, str) or not version:
                  print(f"::warning::{version_file} carries no readable version; the tag job will fail on main")
                  version = None
          if version is not None and os.path.isfile("pyproject.toml") and version_file != "pyproject.toml":
              other = read_version("pyproject.toml")
              if other is not None and other != version:
                  faults.append(f"pyproject.toml version {other} differs from {version_file} version {version}")
          if faults:
              print("\n".join(faults))
              sys.exit(1)
          for key in STEPS:
              print(f"{key}: {contract[key]}")
          print(f"version: {version} (from {version_file})")
          PY

  unit:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run the unit tests
        run: |
          jq -r .unit ci.json > "$RUNNER_TEMP/step.sh"
          bash -eo pipefail "$RUNNER_TEMP/step.sh"
      # Cobertura coverage.xml at the repository root, 90 % of lines, one
      # number for every repository (design, "Constraints" and decision 7).
      - name: Enforce 90 % line coverage
        run: |
          python3 - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse("coverage.xml").getroot()
          except (OSError, ET.ParseError) as exc:
              sys.exit(f"coverage.xml: {exc} (unit must write a Cobertura report at the root)")
          rate = root.get("line-rate")
          if rate is None:
              valid, covered = root.get("lines-valid"), root.get("lines-covered")
              if valid is None or covered is None or float(valid) == 0:
                  sys.exit("coverage.xml: neither line-rate nor lines-valid/lines-covered on the root element")
              rate = float(covered) / float(valid)
          percent = float(rate) * 100
          print(f"line coverage {percent:.1f} % (threshold 90 %)")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"## Unit: line coverage {percent:.1f} % (threshold 90 %)\n")
          if percent < 90:
              sys.exit(1)
          PY

  regression:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run the non-regression tests
        run: |
          jq -r .regression ci.json > "$RUNNER_TEMP/step.sh"
          bash -eo pipefail "$RUNNER_TEMP/step.sh"

  e2e:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run the end-to-end tests
        run: |
          jq -r .e2e ci.json > "$RUNNER_TEMP/step.sh"
          bash -eo pipefail "$RUNNER_TEMP/step.sh"

  # Bare runner: the GitHub image plus the pinned Claude Code CLI, nothing
  # else installed by the pipeline (design, "Constraints" and decision 6).
  environment:
    needs: e2e
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the Claude Code CLI
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
      - name: Run the environment tests
        run: |
          case "$RUNNER_OS" in Linux) CI_OS=linux ;; macOS) CI_OS=macos ;; *) CI_OS=windows ;; esac
          CI_WORK="$(mktemp -d)"
          [ "$CI_OS" = windows ] && CI_WORK="$(cygpath -m "$CI_WORK")"
          export CI_OS CI_WORK
          jq -r .environment ci.json > "$RUNNER_TEMP/step.sh"
          bash -eo pipefail "$RUNNER_TEMP/step.sh"

  # Fresh HOME and CLAUDE_CONFIG_DIR under the scratch directory: the install
  # must succeed from nothing on the three OS (design, "Constraints").
  install:
    needs: environment
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the Claude Code CLI
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
      - name: Run the installation tests
        run: |
          case "$RUNNER_OS" in Linux) CI_OS=linux ;; macOS) CI_OS=macos ;; *) CI_OS=windows ;; esac
          CI_WORK="$(mktemp -d)"
          [ "$CI_OS" = windows ] && CI_WORK="$(cygpath -m "$CI_WORK")"
          HOME="$CI_WORK/home"
          USERPROFILE="$HOME"
          CLAUDE_CONFIG_DIR="$HOME/.claude"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          export CI_OS CI_WORK HOME USERPROFILE CLAUDE_CONFIG_DIR
          jq -r .install ci.json > "$RUNNER_TEMP/step.sh"
          bash -eo pipefail "$RUNNER_TEMP/step.sh"

  # The bot: the documented code-review plugin, then a fix pass on the
  # branch. Runs whether install passed or failed. Skipped by design for a
  # draft, a fork, Dependabot, a head commit authored by the bot (loop
  # guard, decision 8) and a change to this file (decision 2).
  review:
    needs: [contract, install]
    if: >-
      always() && needs.contract.result == 'success' &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Guard on the head commit's author and the changed files
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          author="$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '[(.author.login // ""), .commit.author.name] | join(" ")')"
          files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          reason=""
          case " $author " in *"claude[bot]"*) reason="the head commit $HEAD_SHA is authored by claude[bot] (loop guard)" ;; esac
          if grep -qx '.github/workflows/pipeline.yml' <<<"$files"; then
            reason="the pull request changes .github/workflows/pipeline.yml (no bot review, design decision 2)"
          fi
          if [ -n "$reason" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "## Review skipped: $reason" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout the pull request branch
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: List the failed jobs of this run
        id: failed
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          list="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --jq '.jobs[] | select(.conclusion == "failure") | "- \(.name): \(.html_url)"')"
          [ -n "$list" ] || list="- none: unit, regression, e2e, environment and install all passed"
          {
            echo "list<<EOF_FAILED"
            echo "$list"
            echo "EOF_FAILED"
          } >> "$GITHUB_OUTPUT"
      - name: Review
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
      - name: Fix
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BRANCH: ${{ github.event.pull_request.head.ref }}
            HEAD: ${{ github.event.pull_request.head.sha }}
            PIPELINE RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Failed jobs of this pipeline run (their logs are at the URLs):
            ${{ steps.failed.outputs.list }}

            You are checked out on BRANCH. The five test commands are in ci.json at the
            repository root (unit, regression, e2e, environment, install); unit must leave a
            Cobertura coverage.xml with at least 90 % line coverage.

            1. Read the review findings posted on this pull request:
               gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments
            2. Apply every real finding and fix every failed job on this branch. Fix the
               product, never the pipeline; do not edit .github/workflows/pipeline.yml.
            3. Run the tests that cover what you touched, then commit and push to BRANCH.
            4. When there is nothing to fix, change nothing and push nothing.
          claude_args: >-
            --allowedTools "Read,Edit,Write,MultiEdit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(python3:*),Bash(python:*),Bash(pytest:*),Bash(coverage:*),Bash(uv:*),Bash(uvx:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(cargo:*),Bash(node:*),Bash(bash:*),Bash(sh:*),Bash(jq:*)"

  # A failed review blocks; a skipped review does not (decision 4). Arms
  # squash auto-merge; GitHub merges once this required check is green on
  # the commit the bot last pushed (design, "The bot step"). Same credential
  # mechanism as tag (decision 1).
  merge:
    needs: [unit, regression, e2e, environment, install, review]
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.review.result != 'failure' &&
      needs.unit.result == 'success' &&
      needs.regression.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.environment.result == 'success' &&
      needs.install.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Guard — skip cleanly when RELEASE_TAG_SSH_KEY is missing
        id: guard
        env:
          SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "RELEASE_TAG_SSH_KEY secret not configured — skipping."
            echo "has_deploy_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_deploy_key=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout over the deploy key
        if: steps.guard.outputs.has_deploy_key == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          ssh-key: ${{ secrets.RELEASE_TAG_SSH_KEY }}
      - name: Arm squash auto-merge
        if: steps.guard.outputs.has_deploy_key == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --auto --squash
      - name: Summarize the merge decision
        if: always()
        env:
          HAS_KEY: ${{ steps.guard.outputs.has_deploy_key }}
          REVIEW: ${{ needs.review.result }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "## Merge: skipped — RELEASE_TAG_SSH_KEY not configured" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Merge: auto-merge armed (review job result: $REVIEW)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Cortex's release gate (cdeust/Cortex .github/workflows/ci.yml, ADR-0802):
  # on main, tag vX.Y.Z from ci.json's version_file when that tag does not
  # exist yet, pushed over the deploy key so the release workflows fire.
  tag:
    needs: [unit, regression, e2e, environment, install]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - name: Guard — skip cleanly when RELEASE_TAG_SSH_KEY is missing
        id: guard
        env:
          SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "RELEASE_TAG_SSH_KEY secret not configured — skipping."
            echo "Add the private half of a write-enabled repository deploy"
            echo "key at Settings -> Secrets and variables -> Actions."
            echo "Releases stay manual until it exists."
            echo "has_deploy_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_deploy_key=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout the SHA that just went green
        if: steps.guard.outputs.has_deploy_key == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_TAG_SSH_KEY }}
      - name: Set up Python
        if: steps.guard.outputs.has_deploy_key == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve the version and check for an existing tag
        id: tag_check
        if: steps.guard.outputs.has_deploy_key == 'true'
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import json, sys, tomllib
          path = json.load(open("ci.json", encoding="utf-8")).get("version_file", ".claude-plugin/plugin.json")
          text = open(path, encoding="utf-8").read()
          if path.endswith(".json"):
              data = json.loads(text)
              version = data.get("version") or (data.get("metadata") or {}).get("version")
          elif path.endswith(".toml"):
              data = tomllib.loads(text)
              version = (data.get("project") or {}).get("version") or (data.get("package") or {}).get("version")
          else:
              version = None
          if not isinstance(version, str) or not version:
              sys.exit(f"{path}: no version found; set ci.json version_file to a file with one")
          print(version)
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "tag v${VERSION} already exists — this push carries no version bump"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "no existing tag v${VERSION} — this push is a version bump"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure git identity
        if: steps.guard.outputs.has_deploy_key == 'true' && steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create and push the release tag
        if: steps.guard.outputs.has_deploy_key == 'true' && steps.tag_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.tag_check.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git tag -a "v${VERSION}" -m "Release v${VERSION}" "${SHA}"
          git push origin "refs/tags/v${VERSION}"
      - name: Summarize the release-gate decision
        if: always()
        env:
          HAS_KEY: ${{ steps.guard.outputs.has_deploy_key }}
          EXISTS: ${{ steps.tag_check.outputs.exists }}
          VERSION: ${{ steps.tag_check.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "## Release gate: skipped — RELEASE_TAG_SSH_KEY not configured" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EXISTS" == "true" ]; then
            echo "## Release gate: skipped — v${VERSION} already tagged (no version bump on this push)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Release gate: tagged v${VERSION} at \`${SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

name: Release

# Issue #37. Until now cortex-viz had NO release workflow: 2.7.1 was cut by
# hand, so there was no committed, reproducible build path and therefore no
# artifact to attest. This workflow is the build that was missing — it is now
# the ONLY way a release is produced, and provenance layers on top of it.
#
# Delivery reality (do not confuse with "released"): cortex-viz is consumed
# through Anthropic's plugin marketplace, PINNED in Cortex's marketplace
# manifest. Tagging + this GitHub Release do not reach installs by themselves;
# the release checklist still ENDS with bumping that pin. This is the same
# pin-gate lesson that let six zetetic-team-subagents releases and two
# cortex-viz releases ship to zero installs (Cortex #179) — a release workflow
# that runs is necessary but not sufficient.
#
# NOT published to PyPI. `cortex-viz` returns 404 on PyPI (checked 2026-07-25),
# and the plugin's install path is the marketplace, not `pip install cortex-viz`.
# Issue #37 criterion 4 (PyPI Trusted Publishing) is therefore DROPPED with
# this one-line justification (§13.1): there is no PyPI project to publish to,
# so a Trusted-Publishing job would attest a channel nobody installs from. The
# wheel + sdist are still built and attested and attached to the GitHub Release
# as the concrete artifacts issue #37 says were missing.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package with test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

  release:
    name: Build, fingerprint UI, SBOM, attest + GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release + upload assets
      id-token: write       # OIDC token Sigstore exchanges for a signing cert
      attestations: write   # record the build-provenance statement on the repo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      # Fingerprint the browser-executed UI (issue #37 criterion 2). The 91 JS
      # files + HTML/CSS under ui/ are first-party STATIC assets — there is no
      # bundler to run, so "built and fingerprinted" means: pin every byte a
      # user's browser will execute to this exact commit. The manifest is a
      # sorted `sha256sum` over the whole tree; a tampered UI asset changes its
      # line, and the manifest is itself attested below. LC_ALL=C fixes sort
      # order so the manifest is reproducible across runners.
      - name: Fingerprint UI assets
        run: |
          set -euxo pipefail
          find ui -type f -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > cortex-viz-ui-manifest.sha256
          echo "UI files fingerprinted: $(wc -l < cortex-viz-ui-manifest.sha256)"
          head -5 cortex-viz-ui-manifest.sha256

      - name: Install uv (pinned) for the SBOM
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # CycloneDX SBOM from uv.lock (issue #37 criterion 5). This covers the
      # Python dependency graph, including the viz-tile stack (datashader,
      # pyarrow, numba/llvmlite) that is the heaviest third-party surface. The
      # "vendored JS" the criterion mentions is first-party source, not
      # third-party packages, so it is inventoried by the UI manifest above
      # rather than duplicated here — the two together enumerate everything
      # that ships.
      - name: Build the SBOM
        run: |
          set -euxo pipefail
          uv export --frozen --all-extras --no-dev --no-emit-project --no-hashes \
            --format requirements-txt > sbom-requirements.txt
          wc -l sbom-requirements.txt
          uv tool run --from cyclonedx-bom cyclonedx-py requirements \
            sbom-requirements.txt --output-format JSON --output-file cortex-viz.cdx.json
          ls -la cortex-viz.cdx.json

      - name: Compute SHA-256 checksums for every release asset
        run: |
          set -euxo pipefail
          for f in dist/* cortex-viz.cdx.json cortex-viz-ui-manifest.sha256; do
            sha256sum "$f" | tee "$f.sha256"
          done

      # Provenance BEFORE upload: binds each artifact digest to this workflow,
      # commit and runner. Verify with
      #   gh attestation verify <file> --repo cdeust/cortex-viz
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            cortex-viz.cdx.json
            cortex-viz-ui-manifest.sha256

      - name: Create GitHub Release with attested assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
            cortex-viz.cdx.json
            cortex-viz.cdx.json.sha256
            cortex-viz-ui-manifest.sha256
            cortex-viz-ui-manifest.sha256.sha256
          fail_on_unmatched_files: true
